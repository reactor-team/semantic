# semantic is a standalone repo (its own go.mod under the reactor-team org), not
# part of the reactor monorepo — so this is a plain single-module mise config,
# not monorepo mode. It mirrors the reactor tooling-module conventions:
# file-based tasks in mise-tasks/*.sh (discoverable via `mise tasks`,
# shellcheck-lintable), tools pinned here, Go version read from /.go-version.
#
# No [env] version block: the release is derived (calendar version
# v1.<UTC-date>.0-g<short-sha>) and computed in-task. Override with a RELEASE
# env var.
#
# CGO is REQUIRED: onnxruntime_go's non-Windows path links -ldl via cgo to
# dlopen the ONNX runtime at first use. Building therefore needs a C compiler
# (Xcode command line tools on macOS, build-essential on Debian). See CONTRIBUTING.md
# and the build/install/test tasks.

# Minimum mise version and binary checksums for CI.
min_version = "2026.10.17"

[_]
mise_sha256_linux_x64 = "fe6dd17e68e09682b31d2e7bb7bb755d22636ac1af5d94621e300f2ca9e9fe8a"
mise_sha256_linux_arm64 = "e90904144ba4377c5fbe385f429830282c68f3b4f9c690bf6c5a2ae9b74a809b"
mise_sha256_macos_x64 = "dac5d6db5e315d8e4f096c6ead9279d342e09fdcb5c373d0df5c7dcce8195746"
mise_sha256_macos_arm64 = "9e27709db5eb1e900d83149418d3067309f2a5004d4994d94246ab658ba4a3ce"
mise_sha256_windows_x64 = "d38bd78b63ca1e913e1d55cbd1633b45e9b01f2735ac81b1915f84f75a3eb5cd"

[tools]
# Build golangci-lint with the project Go toolchain. Pin gotestsum for tests.
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = { version = "2.14.0", install_env = { GOTOOLCHAIN = "local" } }
gotestsum = "1.13.0"
# The build tasks are shell and the release path is GitHub Actions, so both are
# linted alongside the Go. actionlint knows which runner labels GitHub still
# offers, which no YAML schema check can tell you.
shellcheck = "0.11.0"
actionlint = "1.7.12"
# Go toolchain is intentionally NOT declared here. The canonical version lives
# in /.go-version and mise reads it via idiomatic_version_file below — same
# single-source pattern as the reactor monorepo.

[settings]
idiomatic_version_file_enable_tools = ["go"]
